<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entregas Programación - Bio-Python</title>
<style>
:root {
  --bg: #0f1115;
  --sidebar-bg: #161923;
  --sidebar-border: #262b3a;
  --accent: #6c8cff;
  --accent-soft: rgba(108, 140, 255, 0.15);
  --text: #e6e8ef;
  --text-dim: #8b90a3;
  --card-bg: #1b1f2b;
  --card-border: #2a2f40;
}
 
* {
  box-sizing: border-box;
}
 
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
}
 
body {
  font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
}
 
.app {
  display: flex;
  height: 100vh;
  overflow: hidden;
}
 
.sidebar {
  width: 260px;
  flex-shrink: 0;
  background: var(--sidebar-bg);
  border-right: 1px solid var(--sidebar-border);
  display: flex;
  flex-direction: column;
  overflow-y: auto;
}
 
.sidebar-title {
  font-size: 1.05rem;
  line-height: 1.35;
  font-weight: 600;
  color: var(--text);
  padding: 24px 20px 16px;
  margin: 0;
  border-bottom: 1px solid var(--sidebar-border);
}
 
.sidebar-title span {
  color: var(--accent);
  font-weight: 700;
}
 
.tabs {
  display: flex;
  flex-direction: column;
  padding: 10px;
  gap: 2px;
}
 
.tab-btn {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 14px;
  border: none;
  background: transparent;
  color: var(--text-dim);
  font-size: 0.92rem;
  text-align: left;
  border-radius: 8px;
  cursor: pointer;
  transition: background 0.15s ease, color 0.15s ease;
}
 
.tab-btn:hover {
  background: rgba(255, 255, 255, 0.04);
  color: var(--text);
}
 
.tab-btn.active {
  background: var(--accent-soft);
  color: var(--accent);
  font-weight: 600;
}
 
.tab-num {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 22px;
  height: 22px;
  border-radius: 6px;
  background: rgba(255, 255, 255, 0.06);
  font-size: 0.75rem;
  flex-shrink: 0;
}
 
.tab-btn.active .tab-num {
  background: var(--accent);
  color: #0f1115;
}
 
.content {
  flex: 1;
  overflow-y: auto;
  padding: 32px 40px;
}
 
.panel {
  display: none;
  height: 100%;
  flex-direction: column;
}
 
.panel.active {
  display: flex;
}
 
.panel-header {
  margin-bottom: 20px;
}
 
.panel-header h2 {
  margin: 0 0 6px;
  font-size: 1.4rem;
}
 
.panel-header p {
  margin: 0;
  color: var(--text-dim);
  font-size: 0.9rem;
}
 
.pdf-wrapper {
  flex: 1;
  border-radius: 12px;
  overflow: hidden;
  border: 1px solid var(--card-border);
  background: #20232e;
  min-height: 0;
}
 
.pdf-wrapper embed,
.pdf-wrapper iframe {
  width: 100%;
  height: 100%;
  border: none;
  display: block;
}
 
.pdf-fallback {
  padding: 20px;
  color: var(--text-dim);
  font-size: 0.9rem;
}
 
.pdf-fallback a {
  color: var(--accent);
}
 
.empty-card {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 1px dashed var(--card-border);
  border-radius: 12px;
  background: var(--card-bg);
  color: var(--text-dim);
  font-size: 0.95rem;
  text-align: center;
  padding: 40px;
}

/* Estilos específicos para el panel de introducción */
.intro-content {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: var(--card-bg);
  border-radius: 12px;
  border: 1px solid var(--card-border);
  padding: 40px;
  text-align: center;
}

.intro-avatar {
  width: 120px;
  height: 120px;
  border-radius: 50%;
  background: var(--accent-soft);
  border: 3px solid var(--accent);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 3rem;
  color: var(--accent);
  margin-bottom: 24px;
}

.intro-content h2 {
  font-size: 2rem;
  margin: 0 0 12px;
  color: var(--text);
}

.intro-content .subtitle {
  font-size: 1.1rem;
  color: var(--accent);
  margin: 0 0 8px;
  font-weight: 500;
}

.intro-content .detail {
  font-size: 0.95rem;
  color: var(--text-dim);
  margin: 4px 0;
}

.intro-divider {
  width: 60px;
  height: 3px;
  background: var(--accent);
  margin: 20px auto;
  border-radius: 4px;
}

.intro-badge {
  display: inline-block;
  background: var(--accent-soft);
  color: var(--accent);
  padding: 6px 16px;
  border-radius: 20px;
  font-size: 0.85rem;
  margin-top: 12px;
}
</style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <h1 class="sidebar-title">Entregas Programación<br><span>Bio-Python</span></h1>
      <nav class="tabs" id="tabs"></nav>
    </aside>
 
    <main class="content" id="content"></main>
  </div>
 
  <script>
    const TOTAL_ENTREGAS = 17;
    const tabsEl = document.getElementById("tabs");
    const contentEl = document.getElementById("content");

    // Construir pestañas: Introducción + entregas
    function buildTabs() {
      // Pestaña Introducción (sin número)
      const introBtn = document.createElement("button");
      introBtn.className = "tab-btn";
      introBtn.dataset.tab = "intro";
      introBtn.innerHTML = `📖 Introducción`;
      introBtn.addEventListener("click", () => activateTab("intro"));
      tabsEl.appendChild(introBtn);

      // Pestañas de entregas
      for (let i = 1; i <= TOTAL_ENTREGAS; i++) {
        const btn = document.createElement("button");
        btn.className = "tab-btn";
        btn.dataset.tab = i;
        btn.innerHTML = `<span class="tab-num">${i}</span> Entrega ${i}`;
        btn.addEventListener("click", () => activateTab(i));
        tabsEl.appendChild(btn);
      }
    }

    function buildPanels() {
      // Panel de Introducción
      const introPanel = document.createElement("section");
      introPanel.className = "panel";
      introPanel.id = "panel-intro";
      introPanel.innerHTML = `
        <div class="intro-content">
          <div class="intro-avatar">👩‍🔬</div>
          <h2>María José Restrepo</h2>
          <p class="subtitle">Estudiante de Biología</p>
          <div class="intro-divider"></div>
          <p class="detail">📚 Universidad CES</p>
          <p class="detail">🧬 BIO 2026</p>
          <span class="intro-badge">🐍 Bio-Python</span>
          <p style="margin-top: 20px; color: var(--text-dim); font-size: 0.9rem; max-width: 400px;">
            Apasionada por la intersección entre la biología y la programación. 
            Explorando el análisis de datos biológicos con Python.
          </p>
        </div>
      `;
      contentEl.appendChild(introPanel);

      // Paneles de entregas
      for (let i = 1; i <= TOTAL_ENTREGAS; i++) {
        const panel = document.createElement("section");
        panel.className = "panel";
        panel.id = `panel-${i}`;
 
        const pdfPath = `semana${i}.pdf`;
        
        panel.innerHTML = `
          <div class="panel-header">
            <h2>Entrega ${i}</h2>
            <p>Visualización embebida: semana${i}.pdf</p>
          </div>
          <div class="pdf-wrapper">
            <embed src="${pdfPath}" type="application/pdf" />
          </div>
          <div class="pdf-fallback">
            Si el PDF no se visualiza correctamente, puedes <a href="${pdfPath}" target="_blank" rel="noopener">abrirlo en una nueva pestaña</a>.
          </div>
        `;
 
        contentEl.appendChild(panel);
      }
    }

    function activateTab(id) {
      // Actualizar botones activos
      document.querySelectorAll(".tab-btn").forEach((btn) => {
        const isActive = String(btn.dataset.tab) === String(id);
        btn.classList.toggle("active", isActive);
      });

      // Actualizar paneles activos
      document.querySelectorAll(".panel").forEach((panel) => {
        const panelId = panel.id.replace("panel-", "");
        const isActive = String(panelId) === String(id);
        panel.classList.toggle("active", isActive);
      });

      // Actualizar hash (para navegación)
      if (id === "intro") {
        window.location.hash = "introduccion";
      } else {
        window.location.hash = `entrega-${id}`;
      }
    }

    function init() {
      buildTabs();
      buildPanels();

      // Leer hash para determinar pestaña inicial
      const hash = window.location.hash;
      let initialId = 1; // por defecto entrega 1

      if (hash === "#introduccion") {
        initialId = "intro";
      } else {
        const hashMatch = hash.match(/entrega-(\d+)/);
        if (hashMatch && Number(hashMatch[1]) >= 1 && Number(hashMatch[1]) <= TOTAL_ENTREGAS) {
          initialId = Number(hashMatch[1]);
        }
      }

      activateTab(initialId);
    }

    init();
  </script>
</body>
</html>
